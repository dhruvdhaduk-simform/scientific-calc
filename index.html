<!DOCTYPE html>

<html lang="en-IN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scientific Calculator</title>

        <link rel="shortcut icon" href="/assets/icons/calc.svg" type="image/x-icon">

        <meta name="description" content="This is the Scientific Calculator site, in which you can perform various Scientific Calculations.">

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Scientific Calculator">
        <meta property="og:description" content="This is the Scientific Calculator site, in which you can perform various Scientific Calculations.">

    <body>
        <header></header>

        <main>
            <div class="display">
                <span class="display-text">0</span>
            </div>

            <div class="control">
                <div class="control-row-1">
                    <button class="btn">DEG</button>
                    <button class="btn">F-E</button>
                </div>
                <button class="btn">MC</button>
                <button class="btn">MR</button>
                <button class="btn">M+</button>
                <button class="btn">M-</button>
                <button class="btn">MS</button>
                <div class="control-row-3">
                    <button class="btn">Trigonometry</button>
                    <button class="btn">Function</button>
                </div>
                <button class="btn">2nd</button>
                <button class="btn">pi</button>
                <button class="btn">e</button>
                <button class="btn">C</button>
                <button class="btn">[=</button>
                <button class="btn">x^2</button>
                <button class="btn">1/x</button>
                <button class="btn">|x|</button>
                <button class="btn">exp</button>
                <button class="btn">mod</button>
                <button class="btn">x^.5</button>
                <button class="btn">(</button>
                <button class="btn">)</button>
                <button class="btn">n!</button>
                <button class="btn">/</button>
                <button class="btn">x^y</button>
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn">X</button>
                <button class="btn">10^x</button>
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn">-</button>
                <button class="btn">log</button>
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn">+</button>
                <button class="btn">ln</button>
                <button class="btn">+/-</button>
                <button class="btn">0</button>
                <button class="btn">.</button>
                <button class="btn">=</button>
            </div>
        </main>
