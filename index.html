<!DOCTYPE html>

<html lang="en-IN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scientific Calculator</title>

        <link rel="shortcut icon" href="/assets/icons/calc.svg" type="image/x-icon">

        <meta name="description" content="This is the Scientific Calculator site, in which you can perform various Scientific Calculations.">

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Scientific Calculator">
        <meta property="og:description" content="This is the Scientific Calculator site, in which you can perform various Scientific Calculations.">
        <meta property="og:image" content="/assets/images/cover_image.png">
        <meta property="og:image:alt" content="Scientific Calculator Cover Image">

        <!-- Twitter Card meta tags -->
        <meta name="twitter:title" content="Scientific Calculator">
        <meta name="twitter:description" content="This is the Scientific Calculator site, in which you can perform various Scientific Calculations.">
        <meta name="twitter:url" content="/">
        <meta name="twitter:image:src" content="/assets/images/cover_image.png ">
        <meta name="twitter:image:alt" content="Scientific Calculator Cover Image">

        <link rel="stylesheet" href="/styles/index.css">
    </head>

    <body>
        <main>
            <div class="display">
                <span class="display-text">0</span>
            </div>

            <div class="control">
                <div class="control-row-1">
                    <button class="btn">DEG</button>
                    <button class="btn">F-E</button>
                </div>
                <button class="btn memory">MC</button>
                <button class="btn memory">MR</button>
                <button class="btn memory">M+</button>
                <button class="btn memory">M-</button>
                <button class="btn memory">MS</button>
                <div class="control-row-3">
                    <button class="btn">
                        <img src="/assets/icons/trigonometry.svg">
                        <span>Trigonometry</span>
                        <img src="/assets/icons/down_arrow.svg">
                    </button>
                    <button class="btn">
                        <img src="/assets/icons/function.svg">
                        <span>Function</span>
                        <img src="/assets/icons/down_arrow.svg">
                    </button>
                </div>
                <button class="btn">
                    2<sup>nd</sup>
                </button>
                <button class="btn pi">π</button>
                <button class="btn e">e</button>
                <button class="btn">C</button>
                <button class="btn">
                    <img src="/assets/icons/backspace.svg">
                </button>
                <button class="btn">
                    x<sup>2</sup>
                </button>
                <button class="btn">
                    1/x
                </button>
                <button class="btn">| x |</button>
                <button class="btn">exp</button>
                <button class="btn">mod</button>
                <button class="btn">
                    √x
                </button>
                <button class="btn">(</button>
                <button class="btn">)</button>
                <button class="btn factorial">n!</button>
                <button class="btn operator divide">
                    <img src="/assets/icons/divide.svg">
                </button>
                <button class="btn">
                    x<sup>y</sup>
                </button>
                <button class="btn numpad digit">7</button>
                <button class="btn numpad digit">8</button>
                <button class="btn numpad digit">9</button>
                <button class="btn operator">
                    <img src="/assets/icons/multiply.svg">
                </button>
                <button class="btn">
                    10<sup>x</sup>
                </button>
                <button class="btn numpad digit">4</button>
                <button class="btn numpad digit">5</button>
                <button class="btn numpad digit">6</button>
                <button class="btn operator">
                    <img src="/assets/icons/minus.svg">
                </button>
                <button class="btn">log</button>
                <button class="btn numpad digit">1</button>
                <button class="btn numpad digit">2</button>
                <button class="btn numpad digit">3</button>
                <button class="btn operator">
                    <img src="/assets/icons/plus.svg">
                </button>
                <button class="btn">ln</button>
                <button class="btn numpad plus-or-minus">±</button>
                <button class="btn numpad digit">0</button>
                <button class="btn numpad dot">.</button>
                <button class="btn equals operator">=</button>
            </div>
        </main>
    </body>
</html>
